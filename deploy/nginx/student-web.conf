# Optional static host for apps/student-web (register.builditmuj.club).
# Build with: npm run build --workspace=student-web
# Copy apps/student-web/dist to /var/www/student-web
# Point CORS_ORIGINS at https://register.builditmuj.club
# Set STUDENT_WEB_URL=https://register.builditmuj.club on the API.

server {
    listen 80;
    listen [::]:80;
    server_name register.builditmuj.club;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name register.builditmuj.club;
    ssl_certificate /etc/letsencrypt/live/register.builditmuj.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/register.builditmuj.club/privkey.pem;
    client_max_body_size 25m;
    root /var/www/student-web;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
